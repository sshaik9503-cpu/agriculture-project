<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Farmer Friendly Agriculture</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">

        <div class="logo">
            🌾 Farmer Friendly
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="signup.html">Signup</a>
        </div>

    </nav>


    <!-- Login Section -->
    <div class="form-container">

        <div class="form-box">

            <h2>Login</h2>

            <p>Login to your Agriculture Account</p>

            <form id="loginForm">

                <!-- Email -->
                <label>Email</label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >


                <!-- Password -->
                <label>Password</label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >


                <!-- Login Button -->
                <button type="submit">
                    Login
                </button>

            </form>


            <!-- Error / Success Message -->
            <p id="loginMessage"></p>


            <!-- Signup Link -->
            <p>
                Don't have an account?
                <a href="signup.html">Create Account</a>
            </p>

        </div>

    </div>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
