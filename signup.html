<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Signup - Farmer Friendly Agriculture</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            🌾 Farmer Friendly
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
        </div>

    </nav>


    <div class="form-container">

        <div class="form-box">

            <h2>Create Account</h2>

            <p>Register as a Farmer/User</p>

            <form id="signupForm">

                <label>Full Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >

                <label>Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label>Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >

                <label>Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required
                >

                <button type="submit">
                    Create Account
                </button>

            </form>

            <p id="message"></p>

            <p>
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
